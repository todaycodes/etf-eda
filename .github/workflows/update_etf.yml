name: Update ETF Data

on:
  schedule:
    - cron: '*/5 * * * *'  # GitHub Actions는 매 분 cron(* * * * *) 설정 시 동작하지 않거나 심한 지연을 겪으므로 최소 단위인 5분 주기로 설정합니다.
  workflow_dispatch:      # 수동 실행 지원

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # 저장소에 쓰기 권한(Commit/Push) 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run data collection script
        run: |
          python src/update_data.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/etf_data.json
          
          # 변경사항이 있는지 확인하고 있으면 커밋 및 푸시 진행
          if ! git diff --staged --quiet; then
            git commit -m "data: Auto-update ETF data [skip ci]"
            git push
          else
            echo "변경 사항이 없어 푸시를 건너뜁니다."
          fi
